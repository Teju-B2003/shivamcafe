<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shivam Cafe Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Kannada:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar, table board across the top, then menu (left) beside a live order/receipt panel (right). Admin view swaps in approvals and audit. */
:root{
  --bg:#F2F0ED; --surface:#FFFFFF; --surface2:#F8F6F3; --ink:#1B1613; --muted:#6B625B; --line:#E1DCD6;
  --brand:#C84A08; --brand-soft:#FDE8DB; --on-brand:#FFFFFF;
  --moss:#2F6B2B; --moss-soft:#E3F0E1; --amber:#8F5A0B; --amber-soft:#FBF0D5; --red:#B3261E; --red-soft:#FBE4E2;
  --slate:#2B2623; --on-slate:#F5F1ED;
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-kn:'Noto Sans Kannada','Nirmala UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13100E; --surface:#1D1916; --surface2:#26211E; --ink:#F3EEE9; --muted:#A39A92; --line:#35302B;
  --brand:#F2762E; --brand-soft:#3A2214; --on-brand:#1A0E06;
  --moss:#8FCB88; --moss-soft:#1F2D1E; --amber:#E3B04B; --amber-soft:#33290F; --red:#F4958E; --red-soft:#3A1816;
  --slate:#EDE7E1; --on-slate:#1B1613; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#13100E; --surface:#1D1916; --surface2:#26211E; --ink:#F3EEE9; --muted:#A39A92; --line:#35302B;
  --brand:#F2762E; --brand-soft:#3A2214; --on-brand:#1A0E06;
  --moss:#8FCB88; --moss-soft:#1F2D1E; --amber:#E3B04B; --amber-soft:#33290F; --red:#F4958E; --red-soft:#3A1816;
  --slate:#EDE7E1; --on-slate:#1B1613; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;padding-inline:16px;padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:1840px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px 14px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand .kn{font-family:var(--f-kn);font-weight:700;font-size:19px;line-height:1.15}
.brand .nm{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;position:relative}
.seg button[aria-pressed="true"]{background:var(--slate);color:var(--on-slate)}
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:700;margin-left:6px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn .dot{position:absolute;top:-6px;right:-6px;margin:0}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:46px;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;z-index:30;max-height:70vh;overflow:auto}
.bellpanel .bh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-weight:700}
.bellpanel .bh button{border:0;background:none;color:var(--brand);font-weight:600;font-size:12px}
.note{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;border-top:1px solid var(--line)}
.note:hover{background:var(--surface2)}
.note.unread{background:var(--brand-soft)}
.note small{display:block;color:var(--muted);margin-top:2px}
.empty-s{padding:14px 10px;color:var(--muted)}

/* demo strip */
.guide{flex:none;display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 14px}
.guide>b{font-family:var(--f-display)}
.guide ol{margin:0;padding:0;list-style:none;display:flex;gap:6px 22px;flex-wrap:wrap;flex:1;color:var(--muted);counter-reset:g}
.guide li{counter-increment:g}
.guide li::before{content:counter(g)'.';font-weight:700;color:var(--ink);margin-right:5px}
.guide li b{color:var(--ink)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--moss);border-color:var(--moss);color:var(--surface)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.block{width:100%}
.btn-row{display:grid;gap:8px;margin-top:10px}
.btn-row.two{grid-template-columns:1fr 1fr}

/* three-pane workspace */
.main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(230px,18vw,270px) minmax(0,1fr) clamp(340px,26vw,410px);gap:16px}
.pane{min-height:0;display:flex;flex-direction:column}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px;flex:none}
.sec-h h2{font-size:17px}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:8px;flex:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .r{background:var(--brand-soft);border-color:var(--brand)}
.legend .b{background:var(--slate);border-color:var(--slate)}
.tgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:8px;align-content:start;padding:3px}
.tbl{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;min-height:72px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tbl .trow{display:flex;justify-content:space-between;gap:6px;align-items:baseline;flex-wrap:wrap}
.tbl .tn{font-family:var(--f-display);font-weight:700;font-size:15px}
.tbl .ta{font-weight:700;font-size:12.5px}
.tbl .ts{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tbl.running{background:var(--brand-soft);border-color:var(--brand)}
.tbl.running .ts{color:var(--ink)}
.tbl.billed{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.tbl.billed .ts{color:var(--on-slate);opacity:.8}
.tbl.sel{outline:3px solid var(--ink);outline-offset:1px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;width:max-content;margin-top:auto}
.tag.pending{background:var(--amber-soft);color:var(--amber)}
.tag.approved{background:var(--moss-soft);color:var(--moss)}
.tag .ic{width:11px;height:11px}

.cats{display:flex;gap:8px;overflow-x:auto;padding:3px 3px 8px;margin-bottom:2px;flex:none}
.cat{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:600;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.mgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));grid-auto-rows:max-content;gap:10px;align-content:start;padding:3px}
.item{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:left;display:flex;align-items:center;gap:12px;min-width:0;min-height:94px}
.item:hover:not([disabled]){border-color:var(--brand)}
.item .ph{flex:none;width:78px;height:78px;border-radius:9px;overflow:hidden;background:var(--surface2)}
.item .ph img{display:block;width:100%;height:100%;object-fit:cover}
.item .ie{flex:none;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:32px;width:78px;height:78px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center}
.item .ib{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.item .in{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.item .ip{font-family:var(--f-mono);font-size:15px;font-weight:600;color:var(--brand)}
.item .q{position:absolute;top:6px;right:6px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:13px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;padding:0 7px;border:2px solid var(--surface)}
.item .so{position:absolute;bottom:8px;right:8px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--red-soft);color:var(--red)}
.item[disabled]{opacity:.5;cursor:not-allowed}
.item[disabled] .ph img{filter:grayscale(1)}
.item.has{border-color:var(--brand)}
.line .lt{width:30px;height:30px;border-radius:7px;object-fit:cover;vertical-align:middle;margin-right:8px}
.line .le{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:18px;margin-right:6px}
.lockbar{display:flex;gap:10px;align-items:center;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:8px 12px;margin:3px 3px 8px;font-weight:500;flex:none}
.lockbar.ok{background:var(--moss-soft);color:var(--moss)}

/* order panel */
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.o-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex:none}
.o-head h2{font-size:19px}
.obody{flex:1 1 auto;min-height:100px;overflow:auto}
.ofoot{flex:none;max-height:62%;overflow:auto;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
.pill.running{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}
.pill.billed{background:var(--slate);border-color:var(--slate);color:var(--on-slate)}
.pill.pending{background:var(--amber-soft);border-color:var(--amber-soft);color:var(--amber)}
.pill.approved,.pill.applied{background:var(--moss-soft);border-color:var(--moss-soft);color:var(--moss)}
.pill.rejected,.pill.cancelled{background:var(--red-soft);border-color:var(--red-soft);color:var(--red)}
.hint{color:var(--muted);padding:18px 4px;text-align:center}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .ln{font-weight:600;overflow-wrap:anywhere}
.line .lp{color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{width:30px;height:30px;border:0;background:var(--surface2);display:grid;place-items:center}
.step button:hover{background:var(--line)}
.step span{min-width:28px;text-align:center;font-weight:700}
.line .la{font-family:var(--f-mono);font-size:13px;min-width:62px;text-align:right}
.tots{display:grid;gap:2px}
.tots div{display:flex;justify-content:space-between;color:var(--muted)}
.tots .gt{color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:22px;margin-top:2px}
.tots .num{font-family:var(--f-mono)}
.tots .gt .num{font-family:var(--f-display)}
.delta{margin-top:8px;padding:7px 10px;border-radius:8px;background:var(--surface2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* receipt */
.receipt{background:var(--surface2);border:1px dashed var(--muted);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:12.5px}
.receipt .rh{text-align:center;display:grid;gap:1px}
.receipt .kn{font-family:var(--f-kn);font-weight:700;font-size:18px}
.receipt .rs{color:var(--muted);font-size:11.5px}
.receipt .rule{border-top:1px dashed var(--muted);margin:8px 0}
.receipt .rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:2px 0}
.receipt .rl span:first-child{overflow-wrap:anywhere}
.receipt .rt{display:flex;justify-content:space-between;color:var(--muted);padding:1px 0}
.receipt .rg{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-top:4px;color:var(--ink)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:9px 12px;margin-top:10px;font-weight:500}
.banner.wait{background:var(--amber-soft);color:var(--amber)}
.banner.good{background:var(--moss-soft);color:var(--moss);margin-top:0;margin-bottom:6px}
.banner.bad{background:var(--red-soft);color:var(--red)}
.banner .ic{margin-top:2px}
.ofoot .banner{margin-top:0}
.reasonbox{display:grid;gap:8px}
.reasonbox label{font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],input[type=number],select{font:inherit;width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

/* admin */
.admin{flex:1;min-height:0;display:flex;flex-direction:column}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;flex:none}
.stat{flex:1 1 140px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.stat small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.stat b{font-family:var(--f-display);font-size:20px}
.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tab{flex:none;white-space:nowrap;border:0;background:none;padding:9px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.ascroll{flex:1;min-height:0;overflow:auto;padding:3px}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.req.new{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.req header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.req h3{font-size:18px}
.req .when{color:var(--muted);font-size:12px}
.why{margin:10px 0;padding:8px 10px;background:var(--surface2);border-radius:8px}
.mini{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:3px;color:var(--muted)}
.mini li{display:flex;justify-content:space-between;gap:8px}
.mini .num{font-family:var(--f-mono)}
.sub-h{margin:20px 0 10px;font-size:16px}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.logl{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.logl li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.logl li:last-child{border-bottom:0}
.logl time{color:var(--muted);font-family:var(--f-mono);font-size:12px}

/* waiters */
.wbar{display:flex;gap:8px;overflow-x:auto;flex:none;padding:2px 2px 4px}
.wchip{flex:none;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 16px 6px 6px;text-align:left}
.wchip:hover{border-color:var(--brand)}
.wchip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.wchip .wcn{display:flex;flex-direction:column;line-height:1.2}
.wchip small{color:var(--muted);font-size:12px}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--slate);color:var(--on-slate);display:grid;place-items:center;font-weight:700;font-family:var(--f-display)}
.wchip[aria-pressed="true"] .av{background:var(--brand);color:var(--on-brand)}
.wn{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:1px}
.wn i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:10px;font-weight:700}
.tbl.billed .wn i{background:var(--on-slate);color:var(--slate)}
.served{color:var(--muted);margin:-6px 0 10px;font-size:13px}
.sec-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:14px 0 6px}
.rnd{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;background:var(--surface2)}
.rnd .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rnd .rh span{color:var(--muted);font-size:12px}
.rnd .ri{margin-top:2px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.tgh{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin:10px 2px 0;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}

/* login */
.login{flex:1;min-height:0;overflow:auto;display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:20px 12px 40px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(100%,400px);display:grid;gap:12px}
.lcard.demo{width:min(100%,560px)}
.lcard h1{margin:6px 0 0;font-size:26px;font-family:var(--f-display)}
.lcard h2{margin:0;font-size:18px}
.lcard p{margin:0}
.lhead .nm{display:block!important}
.top-r .btn.sm.so{display:inline-block!important;padding:6px 9px}
.lerr{background:var(--red-soft);color:var(--red);padding:9px 12px;border-radius:10px;font-weight:600}
.da-g{display:grid;gap:6px}
.demo-acc{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.demo-acc:hover{border-color:var(--brand);background:var(--brand-soft)}
.da-n{display:flex;flex-direction:column;line-height:1.25;min-width:0}.da-n small{color:var(--muted);font-size:12px}
.da-c{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.da-c code{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.who{display:flex;flex-direction:column;line-height:1.2;text-align:right}.who small{color:var(--muted);font-size:11px}
@media (max-width:700px){.who{display:none}.lcard{padding:16px}}

/* staff */
.staffpage{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.staffpage .stabs{align-self:flex-start;max-width:100%;flex:none!important;align-content:start;order:0!important}
.stbody{flex:1;min-height:0;overflow:auto;padding:3px 3px 20px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:14px;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 10px;font-size:17px}
.card h3 .muted{font-size:13px;font-weight:500;margin-left:6px}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.kv.total{border-bottom:0;font-size:17px;padding-top:10px}
.neg{color:var(--red)}
.advform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:14px}
.ptc{display:inline-flex;align-items:center;gap:8px}
.ptc small{display:block;color:var(--muted);font-size:11px}
.selfie{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.selfie.sm{width:30px;height:30px}
.dist{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.dist .ic{width:12px;height:12px}
.dist.good{background:var(--moss-soft);color:var(--moss)}.dist.bad{background:var(--red-soft);color:var(--red)}
.geo{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;margin:10px 0}
.geo .ic{width:20px;height:20px;flex:none}
.geo.ok{background:var(--moss-soft);color:var(--moss)}.geo.bad{background:var(--red-soft);color:var(--red)}
.simbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 4px;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.stats3 .st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.stats3 .st span{font-size:12px;color:var(--muted)}.stats3 .st b{font-size:20px;font-family:var(--f-display)}
.req{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--amber-soft);border-radius:10px;padding:10px 14px;margin-bottom:6px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
td.acts{display:table-cell}td.acts .btn{margin-right:6px}
tr.totr td{background:var(--surface2)}
.regt{min-width:900px}.regt th,.regt td{padding:6px 5px}
.rg{text-align:center;font-size:12px;font-weight:700;min-width:22px}
.rg.P{color:var(--moss);background:var(--moss-soft)}.rg.A{color:var(--red);background:var(--red-soft)}.rg.H{color:var(--amber);background:var(--amber-soft)}.rg.f{color:var(--line)}
select,.fg input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:60;padding:16px}
.ovc{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;width:min(100%,380px);max-height:100%;overflow:auto}
.ovc h3{margin:0 0 10px;font-size:17px}
.camw{position:relative;aspect-ratio:1;background:#111;border-radius:12px;overflow:hidden}
.camw video,.snapimg{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.snapimg{transform:none}
.camph{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;text-align:center;padding:16px}
.cmsg{margin-top:10px}
.chk{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.chk.ok{background:var(--moss-soft);color:var(--moss)}.chk.bad{background:var(--red-soft);color:var(--red)}
.upl{display:flex;justify-content:center;margin-top:8px;cursor:pointer}
.ovc [hidden]{display:none!important}
.btn .ic{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
@media (max-width:700px){.advform{grid-template-columns:1fr}.today{grid-template-columns:1fr 1fr}.staffpage .stabs{display:grid;grid-template-columns:minmax(0,1fr);width:100%}.stabs .mod{text-align:center;white-space:normal}}

/* module menu */
.top{flex-wrap:wrap}
.mods{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;min-width:0;margin:0 auto}
.mod{flex:none;border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;white-space:nowrap}
.mod:hover{background:var(--surface2)}
.mod[aria-pressed="true"]{background:var(--slate);color:var(--on-slate)}
@media (max-width:1100px){.mods{order:3;flex:1 1 100%;margin:0}}
@media (max-width:700px){.mods{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible;gap:3px}.mod{padding:9px 2px;text-align:center;font-size:12.5px}.mod .dot{margin-left:3px;min-width:16px;height:16px;font-size:10px}}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}

/* invoices page */
.invpage{flex:1;min-height:0;display:grid;grid-template-columns:clamp(250px,24vw,310px) minmax(0,1fr);gap:16px}
.invlist{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:3px}
.invview{min-height:0;overflow:auto;padding:3px}
.ibill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.ibill:hover{border-color:var(--brand)}
.ibill.on{border-color:var(--brand);background:var(--brand-soft)}
.ibill .ib2{font-weight:700}
.ibill .ib3{grid-column:1/-1;color:var(--muted);font-size:12px}
.backbtn{display:none}
@media (max-width:900px){
  .invpage{display:flex;flex-direction:column}
  .invlist,.invview{flex:1;min-height:0}
  .invpage .invview{display:none}
  .invpage.open .invlist{display:none}
  .invpage.open .invview{display:block}
  .backbtn{display:inline-block}
}

/* day end */
.rbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.rtip{margin:0 0 14px;color:var(--muted)}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;padding:0!important}
  #app{height:auto!important;display:block!important;max-width:none!important;padding:0!important}
  .ovl{display:none!important}
  .top,.mods,.wbar,.guide,.stats,.tabs,.rbar,.rtip,.addform,.invlist,.tabbar,.toast,.bellpanel{display:none!important}
  .invpage{display:block!important}
  .invview{overflow:visible!important;padding:0!important}
  .admin,.ascroll{display:block!important;overflow:visible!important;height:auto!important;padding:0!important}
  .paper{border:0!important;padding:0!important;max-width:none!important;border-radius:0!important}
  @page{margin:12mm}
}

/* payment */
.paybox{display:grid;gap:12px}
.pay-total{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface2);border-radius:10px;padding:10px 14px}
.pay-total b{font-family:var(--f-display);font-size:28px}
.pmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pm{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;font-weight:700;text-align:left}
.pm:hover{border-color:var(--brand)}
.pm.on{border-color:var(--brand);background:var(--brand-soft)}
.pme{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:22px;line-height:1}
.splitnote{color:var(--muted)}
.splitrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center}
.splitrow label{font-weight:700}
.linkbtn{display:block;margin:10px auto 0;border:0;background:none;color:var(--brand);font-weight:700;text-decoration:underline;padding:4px}

/* inventory */
.invbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.invbar .sp{flex:1}
.invnote{margin:0 0 12px;color:var(--muted)}
.addform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.fg{display:grid;gap:4px;min-width:0}
.fg label{font-size:12px;font-weight:700;color:var(--muted)}
.invgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px}
.ing{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ing.low{border-color:var(--amber)}
.ing.out{border-color:var(--red)}
.ing-h{display:flex;gap:10px;align-items:center}
.ing-h small{color:var(--muted)}
.ing-h .pill{margin-left:auto}
.ing-e{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:22px;width:40px;height:40px;border-radius:10px;background:var(--brand-soft);display:grid;place-items:center;flex:none}
.ing-n{font-weight:700}
.ing-q{display:flex;align-items:baseline;gap:6px}
.ing-q b{font-family:var(--f-display);font-size:22px}
.ing-q .min{margin-left:auto;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss)}
.ing.low .bar i{background:var(--amber)}
.ing.out .bar i{background:var(--red)}
.ing-a{display:flex;gap:6px}
.ing-a .btn{padding:6px 10px;font-size:13px;flex:1}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--slate);color:var(--on-slate);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tabbar{display:none}

/* phones and small tablets: one pane at a time, still no page scroll */
@media (max-width:900px){
  .guide{display:none}
  .brand .nm{display:none}
  .main{display:block}
  .pane{display:none}
  .pane.on{display:flex;height:100%}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
  .tabbar button{padding:10px 6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700}
  .tabbar button[aria-pressed="true"]{background:var(--slate);color:var(--on-slate);border-color:var(--slate)}
  .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
}
@media (max-width:520px){.seg button{padding:6px 10px}.top-r .btn.sm{display:none}}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

function addItem(id,d){

function generateBill(){

  {const ou=usage(b.items),nu=usage(T.items),dl={};new Set([...Object.keys(ou),...Object.keys(nu)]).forEach(k=>dl[k]=(nu[k]||0)-(ou[k]||0));applyUsage(dl)}

const PM=[['cash','Cash','\u{1F4B5}'],['upi','UPI','\u{1F4F1}'],['card','Card','\u{1F4B3}'],['other','Other','\u{1F9FE}']];
const PMN={cash:'Cash',upi:'UPI',card:'Card',other:'Other'};
const OTHERS=['Wallet / Paytm','Coupon','Complimentary','Pay later (credit)'];
function payInit(){ui.pay={mode:'single',method:'cash',tendered:'',ref:'',other:OTHERS[0],lines:{cash:'',upi:'',card:'',other:''}}}
function payLines(total){
  const p=ui.pay;if(!p)return{ok:false,msg:''};
  if(p.mode==='single'){
    if(p.method==='cash'){
      const t=p.tendered===''?total:parseFloat(p.tendered);
      if(!(t>=total))return{ok:false,msg:'Cash received is less than the bill',kind:'bad'};
      return{ok:true,lines:[{m:'cash',amt:total}],tendered:t,change:+(t-total).toFixed(2),msg:t>total?'Return '+rupee(+(t-total).toFixed(2))+' to the customer':'Exact cash, no change to return',kind:'good'};
    }
    const l={m:p.method,amt:total};const ref=p.ref.trim();if(ref)l.ref=ref;if(p.method==='other')l.other=p.other;
    return{ok:true,lines:[l],msg:'Collect '+rupee(total)+' by '+PMN[p.method]+(p.method==='other'?' ('+p.other+')':''),kind:'good'};
  }
  let sum=0;const lines=[];
  PM.forEach(([k])=>{const a=parseFloat(p.lines[k]);if(a>0){sum+=a;lines.push({m:k,amt:+a.toFixed(2)})}});
  sum=+sum.toFixed(2);const rem=+(total-sum).toFixed(2);
  if(!lines.length)return{ok:false,msg:'Enter an amount for at least one method',kind:'wait'};
  if(rem>0)return{ok:false,msg:'Paid '+rupee(sum)+'. Still to collect '+rupee(rem),kind:'wait'};
  if(rem<0)return{ok:false,msg:'Amounts add up to '+rupee(-rem)+' more than the bill',kind:'bad'};
  return{ok:true,lines,msg:'Split payment adds up to the bill',kind:'good'};
}
function paySum(total){
  const r=payLines(total);if(!r.msg)return '';
  return `<div class="banner ${r.kind==='bad'?'bad':r.kind==='wait'?'wait':'good'}" style="margin-top:0">${ic(r.kind==='good'?'check':r.kind==='bad'?'x':'clock')}<span>${esc(r.msg)}</span></div>`;
}
function refreshPay(){
  const T=S.tables[ui.sel];if(!T||!T.bill)return;const b=S.bills[T.bill];
  const el=document.getElementById('pay-sum');if(el)el.innerHTML=paySum(b.total);
  const ok=document.getElementById('pay-ok');if(ok)ok.disabled=!payLines(b.total).ok;
}
function payConfirm(){
  const T=S.tables[ui.sel];if(!ui.pay||!T||T.status!=='billed'||T.edit!=='locked')return;
  const b=S.bills[T.bill];const r=payLines(b.total);if(!r.ok){show(r.msg||'Complete the payment details');return}
  ui.invSel=b.no;b.settled=true;b.pay={at:Date.now(),lines:r.lines,tendered:r.tendered||null,change:r.change||0};
  const how=r.lines.map(l=>PMN[l.m]+(r.lines.length>1?' '+rupee(l.amt):'')).join(' + ');
  logit('Table '+ui.sel+', Bill #'+b.no+' paid '+rupee(b.total)+' by '+how);
  const msg=r.change>0?'Paid by Cash. Return '+rupee(r.change)+' change. Table '+ui.sel+' is free.':'Paid '+rupee(b.total)+' by '+how+'. Table '+ui.sel+' is free.';
  if(T.waiter)note('waiter','Table '+ui.sel+' paid ('+rupee(b.total)+'). Table is free.',ui.sel);
  S.tables[ui.sel]=freshTable();
  ui.pay=null;ui.reasonOpen=false;ui.mtab='tables';save();show(msg);
}

function openCapture(sid,kind,by){
  const st=sget(sid);let stream=null,done=false;
  const ov=document.createElement('div');ov.className='ovl';
  ov.innerHTML=`<div class="ovc" role="dialog" aria-modal="true" aria-label="Attendance selfie"><h3>${esc(sname(st))}: check ${kind==='in'?'in':'out'}</h3><div class="camw"><video autoplay playsinline muted></video><canvas hidden></canvas><div class="camph">Starting camera...</div></div><div class="cmsg"></div><div class="btn-row two cbtn"><button class="btn primary" data-c="snap">Take selfie</button><button class="btn" data-c="cancel">Cancel</button></div><label class="btn block upl" hidden>Use phone camera or a photo<input type="file" accept="image/*" capture="user" hidden></label>${ui.sim!=='live'?'<button class="btn block" data-c="sample" style="margin-top:8px">Use a sample selfie (demo)</button>':''}</div>`;
  document.body.appendChild(ov);
  const q=s=>ov.querySelector(s),vid=q('video'),msg=q('.cmsg');
  const stop=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};
  const close=()=>{stop();ov.remove();render()};
  const fallback=why=>{q('.camph').textContent=why;q('.upl').hidden=false;q('[data-c=snap]').disabled=true};
  try{navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(s=>{stream=s;vid.srcObject=s;q('.camph').hidden=true}).catch(()=>fallback('Camera is not available here.'))}catch(e){fallback('Camera is not available here.')}
  const finish=async photo=>{
    if(done)return;done=true;stop();
    q('.camw').innerHTML=`<img class="snapimg" src="${photo}" alt="Your selfie">`;q('.cbtn').hidden=true;q('.upl').hidden=true;const sm=q('[data-c=sample]');if(sm)sm.hidden=true;
    msg.innerHTML='<div class="chk">Checking your location...</div>';
    let pos=null,why='';
    if(ui.sim!=='live')pos=simPos();
    else pos=await new Promise(res=>{if(!navigator.geolocation){why='This device cannot share its location.';res(null);return}navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),e=>{why=e&&e.code===1?'Location permission was denied. Allow location and try again.':'Could not get the location. Try again outdoors or near a window.';res(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:0})});
    const r=pos?checkPoint(sid,kind,photo,pos,by):{ok:false,why};
    msg.innerHTML=`<div class="chk ${r.ok?'ok':'bad'}"><b>${r.ok?'Attendance recorded':'Rejected'}</b><span>${r.ok?'Checked '+kind+' at '+hm(Date.now())+', '+r.dist+' m from the cafe.':esc(r.why)}</span></div><button class="btn primary block" data-c="done" style="margin-top:10px">${r.ok?'Done':'Close'}</button>`;
    q('[data-c=done]').addEventListener('click',close);
  };
  const frame=el=>{const c=q('canvas'),S2=180;c.width=S2;c.height=S2;const x=c.getContext('2d');const w=el.videoWidth||el.naturalWidth||el.width,hh=el.videoHeight||el.naturalHeight||el.height,m=Math.min(w,hh);x.drawImage(el,(w-m)/2,(hh-m)/2,m,m,0,0,S2,S2);return c.toDataURL('image/jpeg',.6)};
  ov.addEventListener('click',e=>{const a=e.target.closest('[data-c]');if(!a)return;const k=a.dataset.c;
    if(k==='cancel')close();
    else if(k==='snap'){if(vid.videoWidth)finish(frame(vid))}
    else if(k==='sample'){const c=q('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#C84A08';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='bold 90px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((sname(st)||'?').charAt(0).toUpperCase(),90,98);finish(c.toDataURL('image/jpeg',.6))}});
  q('input[type=file]').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>finish(frame(im));im.src=URL.createObjectURL(f)});
}

    mid=`<div class="splitnote">Enter how much each method pays. The total must match the bill.</div>`+PM.map(([k,l,e])=>`<div class="splitrow"><label for="pay-l-${k}"><span aria-hidden="true">${e}</span> ${l}</label><input type="number" inputmode="decimal" id="pay-l-${k}" min="0" step="any" placeholder="0" value="${esc(p.lines[k])}"><button class="btn sm" data-a="fillrest" data-v="${k}">Rest</button></div>`).join('');
  }

  const foot=`<div class="btn-row two" style="margin-top:0"><button class="btn ok" id="pay-ok" data-a="payconfirm" ${r.ok?'':'disabled'}>Confirm payment</button><button class="btn" data-a="paycancel">Back</button></div>

  return `<div class="o-head"><h2>Table ${n} &middot; Payment</h2><span class="pill billed">Bill #${b.no}</span></div><div class="obody">${body}</div><div class="ofoot">${foot}</div>`;
}
function orderPanel(){
  const n=ui.sel;
  if(!n)return '<div class="o-head"><h2>Order</h2></div><div class="obody"><div class="hint">Pick a table to start an order.</div></div>';
  const T=S.tables[n];const c=calc(T.items);
  if(ui.pay&&T.status==='billed'&&T.edit==='locked')return paySheet(n,S.bills[T.bill]);
  const label=T.status==='billed'?(T.edit==='pending'?'Edit pending':T.edit==='approved'?'Editing':'Billed'):(T.status==='running'?'Running':'Free');
  const cls=T.status==='billed'?(T.edit==='locked'?'billed':T.edit):T.status;
  let body='',foot='';
  if(T.status!=='billed'){
    body=lines(T)+roundsBlock(T,'Orders from waiters');
    if(c.n)foot=totals(c)+`<div class="btn-row two"><button class="btn primary" data-a="bill">Generate bill</button><button class="btn" data-a="clearorder">Clear order</button></div>`;
  }else{

    }else{
      const diff=diffText(b.items,T.items);
      body=`<div class="banner good">${ic('check')}<span>Editing unlocked by admin for Bill #${b.no}.</span></div>`+lines(T);
      foot=totals(c)+`<div class="delta"><span>Saved bill: <b class="num">${rupee(b.total)}</b></span><span>New total: <b class="num">${rupee(c.total)}</b></span></div>${diff?`<div style="margin-top:6px;color:var(--muted)">Changes: ${esc(diff)}</div>`:''}

}
function admin(){
  const pend=S.reqs.filter(r=>r.status==='pending');
  const bills=Object.values(S.bills).sort((a,b)=>b.no-a.no);
  const sales=bills.reduce((s,b)=>s+b.total,0);
  const edits=bills.reduce((s,b)=>s+b.history.length-1,0);

  let body='';
  if(ui.tab==='approvals'){
    body=(pend.length?`<div class="reqs">${pend.map(r=>{const bl=S.bills[r.billNo];return `<article class="req new"><header><h3>Table ${r.table} &middot; Bill #${r.billNo}</h3><span class="when">${ago(r.at)}</span></header>
      <div class="why"><b>Reason:</b> ${esc(r.reason)}</div>
      <ul class="mini">${Object.keys(bl.items).filter(k=>bl.items[k]>0).map(id=>`<li><span>${bl.items[id]} x ${MI[id].name}</span><span class="num">${rupee(MI[id].price*bl.items[id])}</span></li>`).join('')}</ul>
      <div class="delta"><span>Current bill total</span><b class="num">${rupee(bl.total)}</b></div>
      <div class="btn-row two"><button class="btn ok" data-a="approve" data-id="${r.id}">Approve edit</button><button class="btn danger" data-a="reject" data-id="${r.id}">Reject</button></div></article>`}).join('')}</div>`
      :`<div class="hint" style="background:var(--surface);border:1px solid var(--line);border-radius:14px">No edit requests waiting. When a cashier asks to change a billed table, it shows here and in the bell.</div>`);
    const past=S.reqs.filter(r=>r.status!=='pending');
    if(past.length)body+=`<h2 class="sub-h">Earlier requests</h2><div class="tw"><table><thead><tr><th>Time</th><th>Table</th><th>Bill</th><th>Reason</th><th>Outcome</th></tr></thead><tbody>${past.map(r=>`<tr><td>${hm(r.at)}</td><td>Table ${r.table}</td><td>#${r.billNo}</td><td>${esc(r.reason)}</td><td><span class="pill ${r.status}">${r.status==='applied'?'Approved and edited':r.status[0].toUpperCase()+r.status.slice(1)}</span></td></tr>`).join('')}</tbody></table></div>`;
  }else if(ui.tab==='inventory'){
    body=invView();
  }else if(ui.tab==='dayend'){
    body=dayView();
  }else{
    body=colSummary()+`<div class="tw"><table><thead><tr><th>Bill</th><th>Table</th><th>Revision</th><th class="r">Total</th><th>Last change</th><th>Payment</th></tr></thead><tbody>${bills.map(b=>{const h=b.history[b.history.length-1];return `<tr><td>#${b.no}</td><td>Table ${b.table}</td><td>Rev ${b.rev}</td><td class="r num">${rupee(b.total)}</td><td>${hm(h.at)} &middot; ${esc(h.note)}</td><td>${b.settled?esc(payText(b)):'Open'}</td></tr>`}).join('')}</tbody></table></div>
    <h2 class="sub-h">Activity log</h2><ul class="logl">${S.log.map(l=>`<li><time>${hm(l.at)}</time><span>${esc(l.text)}</span></li>`).join('')}</ul>`;
  }
  return `<main class="admin">${(ui.tab==='approvals'||ui.tab==='audit')?stats:''}<div class="ascroll">${body}</div></main>`;
}
function colSummary(){
  const t={cash:0,upi:0,card:0,other:0};let n=0,open=0;
  Object.values(S.bills).forEach(b=>{if(!b.settled){open++;return}n++;if(b.pay)b.pay.lines.forEach(l=>t[l.m]+=l.amt);else t.other+=b.total});
  return `<h2 class="sub-h" style="margin-top:0">Collected by payment method</h2><div class="stats">${PM.map(([k,l,e])=>`<div class="stat"><small><span aria-hidden="true">${e}</span> ${l}</small><b class="num">${rupee(t[k])}</b></div>`).join('')}<div class="stat"><small>Open bills</small><b class="num">${open}</b></div></div>`;
}

function dayData(){
  const bills=Object.values(S.bills).sort((a,b)=>a.no-b.no);
  const D={bills,sub:0,cgst:0,sgst:0,round:0,total:0,paid:0,open:[],items:{},cats:{},pay:{cash:{n:0,amt:0},upi:{n:0,amt:0},card:{n:0,amt:0},other:{n:0,amt:0}},use:{},revised:[],qty:0,
    tbl:{},wtr:{},running:Object.keys(S.tables).filter(k=>S.tables[k].status==='running').map(k=>({n:+k,total:calc(S.tables[k].items).total})),
    reqs:{ok:S.reqs.filter(r=>r.status==='applied'||r.status==='approved').length,no:S.reqs.filter(r=>r.status==='rejected').length}};
  bills.forEach(b=>{
    const c=calc(b.items);D.sub+=c.sub;D.cgst+=c.cgst;D.sgst+=c.sgst;D.round+=c.round;D.total+=b.total;
    if(b.settled){D.paid++;(b.pay?b.pay.lines:[{m:'other',amt:b.total}]).forEach(l=>{D.pay[l.m].n++;D.pay[l.m].amt+=l.amt})}else D.open.push(b);
    for(const id in b.items){const q=b.items[id];if(!(q>0)||!MI[id])continue;const m=MI[id];
      const it=D.items[id]||(D.items[id]={name:m.name,cat:m.cat,qty:0,amt:0});it.qty+=q;it.amt+=m.price*q;
      const ct=D.cats[m.cat]||(D.cats[m.cat]={qty:0,amt:0});ct.qty+=q;ct.amt+=m.price*q;D.qty+=q}
    const tt=D.tbl[b.table]||(D.tbl[b.table]={n:0,amt:0});tt.n++;tt.amt+=b.total;
    const wk=b.waiter||'none';const ww=D.wtr[wk]||(D.wtr[wk]={n:0,amt:0,t:new Set()});ww.n++;ww.amt+=b.total;ww.t.add(b.table);
    const u=usage(b.items);for(const k in u)D.use[k]=(D.use[k]||0)+u[k];
    if(b.rev>1)D.revised.push(b);
  });
  D.openAmt=D.open.reduce((s,b)=>s+b.total,0);D.runAmt=D.running.reduce((s,t)=>s+t.total,0);
  return D;
}

function csvText(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const D=dayData();
  const head=['Bill no','Table','Waiter','Time','Version','Subtotal','CGST','SGST','Round off','Total','Payment','Status'];
  const rows=D.bills.map(b=>{const c=calc(b.items);return [b.no,'Table '+b.table,b.waiter?wname(b.waiter):'Reception',hm(b.at),b.rev>1?'Rev '+b.rev:'Original',c.sub.toFixed(2),c.cgst.toFixed(2),c.sgst.toFixed(2),c.round.toFixed(2),b.total.toFixed(2),b.settled?payText(b):'',b.settled?'Paid':'Unpaid'].map(q).join(',')});
  return '﻿'+head.map(q).join(',')+'\r\n'+rows.join('\r\n')+'\r\n';
}
async function saveFile(name,data,mime){
  try{const dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data});return true}}catch(e){if(e&&e.code==='declined')return false}
  try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);return true}catch(e){return false}
}

function bizLines(){

  if(b.addr)l.push(esc(b.addr));if(b.phone)l.push('Phone: '+esc(b.phone));if(b.gstin)l.push('GSTIN: '+esc(b.gstin));if(b.fssai)l.push('FSSAI: '+esc(b.fssai));
  return l.length?`<div class="muted" style="font-size:12px;margin-top:2px">${l.join('<br>')}</div>`:'';
}
function numWords(n){
  n=Math.round(n);if(n===0)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:t[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' '+two(x%100):''):two(x);
  const out=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(two(cr)+' Crore');if(lk)out.push(two(lk)+' Lakh');if(th)out.push(two(th)+' Thousand');if(n)out.push(three(n));
  return out.join(' ');
}

  <div class="ph"><div><div class="kn">ಶಿವಂ ಕೆಫೆ</div><div class="cafe">${esc(biz.name||'The Shivam Cafe')}</div>${bizLines()}</div>

  <table><thead><tr><th>#</th><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
  <table class="tt"><tbody><tr><td>Subtotal</td><td class="r n">${rupee(c.sub)}</td></tr><tr><td>CGST 2.5%</td><td class="r n">${rupee(+c.cgst.toFixed(2))}</td></tr><tr><td>SGST 2.5%</td><td class="r n">${rupee(+c.sgst.toFixed(2))}</td></tr><tr><td>Round off</td><td class="r n">${c.round>=0?'+':'−'}${Math.abs(c.round).toFixed(2)}</td></tr></tbody><tfoot><tr><td>Total</td><td class="r n">${rupee(b.total)}</td></tr></tfoot></table>
  <p class="words"><b>Amount in words:</b> Rupees ${numWords(b.total)} only</p>

function invoicesPage(){
  const all=Object.values(S.bills).sort((a,b)=>a.table-b.table||b.no-a.no);
  const tables=[...new Set(all.map(b=>b.table))];
  if(ui.invTbl!=='all'&&!tables.includes(ui.invTbl))ui.invTbl='all';
  const shown=ui.invTbl==='all'?all:all.filter(b=>b.table===ui.invTbl);
  if(!ui.invSel||!shown.some(b=>b.no===ui.invSel))ui.invSel=shown.length?shown[0].no:null;
  const sel=ui.invSel?S.bills[ui.invSel]:null;
  const chip=(v,l)=>`<button class="chip" data-a="invtbl" data-v="${v}" aria-pressed="${ui.invTbl===v||(v!=='all'&&ui.invTbl===+v)}">${l}</button>`;
  const chips=`<div class="tchips" role="group" aria-label="Filter by table">${chip('all','All tables')}${tables.map(t=>chip(t,'Table '+t)).join('')}</div>`;
  let list='';
  tables.filter(t=>ui.invTbl==='all'||ui.invTbl===t).forEach(t=>{
    const bs=all.filter(b=>b.table===t);
    list+=`<div class="tgh"><span>Table ${t}</span><span class="n">${bs.length} bill${bs.length>1?'s':''} &middot; ${rupee(bs.reduce((s,b)=>s+b.total,0))}</span></div>`+bs.map(b=>`<button class="ibill ${b.no===ui.invSel?'on':''}" data-a="invsel" data-n="${b.no}"><span><b class="n">#${b.no}</b>${b.rev>1?' &middot; Rev '+b.rev:''}${b.waiter?' &middot; '+esc(wname(b.waiter)):''}</span><span class="ib2 n">${rupee(b.total)}</span><span class="ib3">${hm(b.at)} &middot; ${b.settled?esc(payText(b)):'Unpaid'}</span></button>`).join('');

  return `<main class="invpage ${ui.invOpen?'open':''}"><aside class="invlist" aria-label="Bills by table">${chips}${list}</aside><section class="invview">${view}</section></main>`;

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b){if(ui.bell&&!e.target.closest('.bellwrap')){ui.bell=false;render()}return}
  const d=b.dataset;
  switch(d.a){
    case 'nav':{if(!allowed(d.v)){show('Your login cannot open this screen');break}ui.page=d.v;ui.bell=false;ui.pay=null;ui.reasonOpen=false;ui.bizOpen=false;ui.invOpen=false;if(d.v==='waiters')ui.role='waiter';else if(d.v==='staff')ui.role=ui.stab==='admin'?'admin':ui.stab==='desk'?'cashier':'waiter';else if(d.v==='billing')ui.role='cashier';else if(d.v!=='invoices'){ui.role='admin';ui.tab=d.v}render();break}
    case 'login':{const u=document.getElementById('lg-user'),w=document.getElementById('lg-pass');ui.lgUser=u?u.value:'';
      if(!doLogin(u&&u.value,w&&w.value)){ui.lgErr='Wrong user ID or password.'}render();break}
    case 'demologin':doLogin(d.u,d.p);render();break;
    case 'logout':doLogout();render();break;
    case 'stab':if(ui.user.role!=='admin'&&((d.v==='admin')||(d.v==='desk'&&ui.user.role!=='reception')))break;ui.stab=d.v;ui.role=d.v==='admin'?'admin':d.v==='desk'?'cashier':'waiter';render();break;
    case 'spick':ui.ssel=d.v;render();break;
    case 'sim':ui.sim=d.v;if(d.v!=='live'&&!S.geo){S.geo={...DEMO_GEO};save()}render();break;
    case 'chk':openCapture(ui.ssel,d.k,'self');break;
    case 'dchk':openCapture(d.s,d.k,'Reception');break;
    case 'dmark':markStatus(d.s,d.v,'Reception');render();break;
    case 'advreq':{const a=document.getElementById('adv-amt'),n=document.getElementById('adv-note');const r=reqAdvance(ui.ssel,a&&a.value,n&&n.value,sname(sget(ui.ssel)));if(!r.ok)show(r.why);else show('Advance request sent to admin');break}
    case 'advadd':{const g=x=>document.getElementById(x);const r=reqAdvance(g('adm-s').value,g('adm-amt').value,g('adm-note').value,'Admin');if(!r.ok)show(r.why);else show('Advance recorded');break}
    case 'advok':{const r=decideAdv(d.id,true);show(r===false?'Advance would exceed the monthly salary':'Advance approved');break}
    case 'advno':decideAdv(d.id,false);show('Advance rejected');break;
    case 'paycsv':saveFile('payroll-'+dk(Date.now()).slice(0,7)+'.csv',payrollCsv(),'text/csv');break;
    case 'geodemo':S.geo={...DEMO_GEO};save();show('Demo cafe location set');break;
    case 'geoset':{if(!navigator.geolocation){show('This device cannot share its location');break}
      navigator.geolocation.getCurrentPosition(p=>{S.geo={lat:p.coords.latitude,lng:p.coords.longitude,r:100,demo:false};logit('Cafe location set');save();show('Cafe location saved')},e=>show('Could not read the location. Allow location access.'),{enableHighAccuracy:true,timeout:12000});break}
    case 'wpick':ui.waiter=d.v;render();break;
    case 'wsel':{ui.wsel=+d.n;ui.wtab=S.tables[ui.wsel].status==='billed'?'cart':'menu';render();break}
    case 'wadd':case 'winc':draftAdd(d.id,1);break;
    case 'wdec':draftAdd(d.id,-1);break;
    case 'wclear':delete ui.draft[ui.wsel];render();break;
    case 'wsend':sendOrder();break;
    case 'wtab':ui.wtab=d.v;render();break;
    case 'invtbl':ui.invTbl=d.v==='all'?'all':+d.v;ui.invSel=null;ui.invOpen=false;render();break;
    case 'invsel':ui.invSel=+d.n;ui.invOpen=true;ui.bizOpen=false;render();break;
    case 'invback':ui.invOpen=false;render();break;
    case 'viewinv':ui.invSel=+d.n;ui.invTbl='all';ui.page='invoices';ui.invOpen=true;ui.pay=null;render();break;
    case 'bizopen':ui.bizOpen=!ui.bizOpen;render();break;
    case 'bizsave':{const g=x=>{const e=document.getElementById(x);return e&&e.value?String(e.value).trim():''};const gs=g('biz-gstin').toUpperCase().replace(/\s+/g,'');
      if(gs&&!/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(gs)){show('GSTIN should be 15 characters, like 29ABCDE1234F1Z5');break}
      S.biz={name:g('biz-name')||'The Shivam Cafe',addr:g('biz-addr'),phone:g('biz-phone'),gstin:gs,fssai:g('biz-fssai')};S.waiters.forEach((w,i)=>{const v=g('biz-w'+(i+1));if(v)w.name=v});ui.bizOpen=false;save();show('Business details saved');break}
    case 'invdl':{const b=S.bills[ui.invSel];if(b)saveFile('Invoice-SC-'+b.no+'.html',invoiceDoc(b),'text/html').then(ok=>{if(ok)show('Invoice ready')});break}
    case 'role':ui.page=d.v==='admin'?(ui.tab||'approvals'):d.v==='waiter'?'waiters':'billing';ui.role=d.v;ui.pay=null;ui.bell=false;ui.reasonOpen=false;render();break;
    case 'bell':ui.bell=!ui.bell;render();break;
    case 'readall':S.notes.forEach(n=>{if(n.role===ui.role)n.read=true});save();render();break;
    case 'note':{const n=S.notes.find(x=>x.id===d.id);if(n){n.read=true;if(ui.role==='admin'){ui.tab=n.tab||'approvals';ui.page=ui.tab}else if(ui.role==='waiter'){if(n.table)ui.wsel=n.table;ui.page='waiters';ui.wtab='cart'}else{if(n.table)ui.sel=n.table;ui.page='billing'}}ui.bell=false;save();render();break}
    case 'sel':{ui.sel=+d.n;ui.pay=null;ui.reasonOpen=false;ui.reason='';ui.mtab=S.tables[ui.sel].status==='billed'?'order':'menu';render();break}
    case 'takepay':{const T=S.tables[ui.sel];if(T&&T.status==='billed'&&T.edit==='locked'){payInit();render()}break}
    case 'paycancel':ui.pay=null;render();break;
    case 'paysplit':{const m=ui.pay.mode==='single'?'split':'single';ui.pay.mode=m;render();break}
    case 'pm':ui.pay.method=d.v;render();break;
    case 'qcash':ui.pay.tendered=String(d.v);render();break;
    case 'fillrest':{const T=S.tables[ui.sel],b=S.bills[T.bill];let sum=0;PM.forEach(([k])=>{if(k!==d.v)sum+=parseFloat(ui.pay.lines[k])||0});ui.pay.lines[d.v]=String(Math.max(0,+(b.total-sum).toFixed(2)));render();break}
    case 'payconfirm':payConfirm();break;
    case 'mtab':ui.mtab=d.v;render();break;
    case 'cat':ui.cat=d.v;render();break;
    case 'add':case 'inc':addItem(d.id,1);break;
    case 'dec':addItem(d.id,-1);break;
    case 'bill':generateBill();break;
    case 'clearorder':clearOrder();break;
    case 'editreq':ui.reasonOpen=true;render();break;
    case 'closereason':ui.reasonOpen=false;ui.reason='';render();break;
    case 'chip':ui.reason=d.v;render();break;
    case 'sendreq':sendRequest();break;
    case 'cancelreq':cancelRequest();break;
    case 'approve':decide(d.id,true);break;
    case 'reject':decide(d.id,false);break;
    case 'saverev':saveRevision();break;
    case 'discard':discardEdit();break;
    case 'settle':settle();break;
    case 'tab':ui.tab=d.v;ui.page=d.v;render();break;
    case 'rprint':try{window.print()}catch(e){show('Print is not available here. Download the report instead.')}break;
    case 'rdl':saveFile('Shivam-Cafe-Day-End-'+dayIso()+'.html',reportDoc(),'text/html').then(ok=>{if(ok)show('Day end report ready')});break;
    case 'rcsv':saveFile('Shivam-Cafe-Bills-'+dayIso()+'.csv',csvText(),'text/csv').then(ok=>{if(ok)show('Bills file ready')});break;
    case 'invf':ui.invf=d.v;render();break;
    case 'invadd':ui.invAdd=!ui.invAdd;render();break;
    case 'stk':{const i=ingOf(d.id);S.stock[i.id]=Math.max(0,+((S.stock[i.id]||0)+(+d.d)*i.step).toFixed(3));save();render();break}
    case 'restock':{const i=ingOf(d.id);const to=+(i.min*3).toFixed(2);const add=Math.max(0,to-(S.stock[i.id]||0));S.stock[i.id]=to;logit('Restocked '+i.name+': +'+fq(add)+' '+i.unit+' (now '+fq(to)+')');save();show(i.name+' restocked to '+fq(to)+' '+i.unit);break}
    case 'invsave':{const g=x=>document.getElementById(x);const name=g('inv-name').value.trim(),qty=parseFloat(g('inv-qty').value),min=parseFloat(g('inv-min').value);
      if(!name){show('Enter the item name');break}if(!(qty>=0)||!(min>=0)){show('Stock and alert level must be numbers');break}
      const unit=g('inv-unit').value,id='c'+uid();S.ings.push({id,name,cat:g('inv-cat').value,unit,min,step:unit==='pcs'?10:1,e:'\u{1F4E6}'});S.stock[id]=qty;ui.invAdd=false;logit('Added '+name+' to inventory ('+fq(qty)+' '+unit+')');save();show(name+' added to inventory');break}
    case 'hideguide':ui.guide=false;render();break;
    case 'reset':{const bz=S.biz,wt=S.waiters,gz=S.geo;S=seed();S.biz=bz||S.biz;if(wt)S.waiters=wt;if(gz)S.geo=gz}ui.page='waiters';ui.role='waiter';ui.wsel=4;ui.wtab='tables';ui.draft={};ui.invTbl='all';ui.invSel=null;ui.invOpen=false;ui.bizOpen=false;ui.pay=null;ui.tab='approvals';ui.invf='all';ui.invAdd=false;ui.sel=2;ui.mtab='order';ui.role='waiter';ui.stab='me';ui.ssel='s1';ui.reasonOpen=false;ui.reason='';save();show('Demo reset');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&(e.target.id==='lg-user'||e.target.id==='lg-pass')){e.preventDefault();const b=document.querySelector('[data-a=login]');if(b)b.click()}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='reason-in'){ui.reason=e.target.value;return}
  if(!ui.pay)return;
  if(id==='pay-tendered')ui.pay.tendered=e.target.value;
  else if(id==='pay-ref')ui.pay.ref=e.target.value;
  else if(id==='pay-other')ui.pay.other=e.target.value;
  else if(id&&id.indexOf('pay-l-')===0)ui.pay.lines[id.slice(6)]=e.target.value;
  else return;
  refreshPay()});
window.addEventListener('storage',e=>{if(e.key===SKEY)return;if(e.key===KEY&&e.newValue){try{S=JSON.parse(e.newValue);render()}catch(x){}}});
restoreSession();render();
</script>
</body></html>
